name: Monthly digest (Slack)

# Once a month, diff the catalog (index.html SEED) + your synced progress against
# last month's snapshot and post a Slack summary. The snapshot is stored as a
# second file inside the same private Gist as your data — nothing is committed.

on:
  schedule:
    - cron: "0 8 1 * *"   # 08:00 UTC on the 1st of each month
  workflow_dispatch:        # run on demand from the Actions tab

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Authenticate pip for the private automation-core dep
        env:
          AUTOMATION_CORE_TOKEN: ${{ secrets.AUTOMATION_CORE_TOKEN }}
        run: |
          # Fail here, loudly, if the secret is missing. With an EMPTY token the
          # insteadOf rewrite below still applies and silently corrupts every
          # github.com URL for the rest of the job — the 2026-09-13 run lost its
          # own checkout to exactly that. A blank secret is a configuration
          # error, not a transient one, so say what to do.
          if [ -z "${AUTOMATION_CORE_TOKEN}" ]; then
            echo "::error::AUTOMATION_CORE_TOKEN is not set on this repository. automation-core is private and cannot be installed without it. Add it with: gh secret set AUTOMATION_CORE_TOKEN -R ${GITHUB_REPOSITORY}"
            exit 1
          fi
          # automation-core is private; rewrite github.com HTTPS to carry a token
          # that can read it so the git+https requirement resolves.
          git config --global url."https://x-access-token:${AUTOMATION_CORE_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Post monthly digest
        env:
          # PAT with `gist` scope (+ `repo` only if this repo is private) so the
          # job can read the private Gist and read index.html.
          GITHUB_TOKEN: ${{ secrets.RONIN_GIST_TOKEN }}
          RONIN_GIST_ID: ${{ secrets.RONIN_GIST_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Incidents go to the shared #incidents channel, never to the digest
          # channel — a monthly job that fails silently is late by a month.
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
        run: python digest.py

      # The last-resort alert. It must not depend on anything that can itself
      # fail — on 2026-09-13 the missing AUTOMATION_CORE_TOKEN broke pip, and the
      # previous version of this step tried to pip-install the alerter to report
      # it, could not, and exited 0 in silence. So: curl and the webhook, nothing
      # else. Never raises; a failed alert must not mask the original failure.
      - name: "Report a failure to #incidents"
        if: failure()
        env:
          SLACK_ALERT_WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_ALERT_WEBHOOK_URL" ]; then
            echo "SLACK_ALERT_WEBHOOK_URL not set — incident not posted"; exit 0
          fi
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat > /tmp/alert.json <<JSON
          {"blocks": [
            {"type": "header", "text": {"type": "plain_text", "text": "🔴 Workflow failed before the digest ran", "emoji": true}},
            {"type": "context", "elements": [{"type": "mrkdwn", "text": "*ronin / monthly-digest*"}]},
            {"type": "section", "text": {"type": "mrkdwn", "text": "A step failed outside digest.py — checkout, pip install, or the runner. No digest this month."}},
            {"type": "section", "text": {"type": "mrkdwn", "text": "*What to do:* Open the run log. If the *Authenticate pip* step failed, the AUTOMATION_CORE_TOKEN secret is missing or expired on this repo."}},
            {"type": "context", "elements": [{"type": "mrkdwn", "text": "<${RUN_URL}|${GITHUB_REPOSITORY} run ${GITHUB_RUN_ID}>"}]}
          ]}
          JSON
          curl -sS -X POST -H 'Content-Type: application/json' --data @/tmp/alert.json "$SLACK_ALERT_WEBHOOK_URL" \
            && echo "incident posted" || echo "could not post the incident; the red tick stands"
